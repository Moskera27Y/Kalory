services:
  - type: web
    name: kalory-api
    runtime: docker
    dockerfilePath: ./Base de Datos/Dockerfile
    dockerContext: ./Base de Datos
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PUBLIC_URL
        value: https://kalory-api.onrender.com
      - key: DATA_FILE
        value: /tmp/kalory-online.db
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 60146882018-1ad06p3sgqlo46ka8s2msm50r2m2durd.apps.googleusercontent.com
      - key: GOOGLE_WEB_CLIENT_ID
        value: 432585530321-pk7t5smbmlcn77vka8dm3kf0r1vs45i5.apps.googleusercontent.com
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false